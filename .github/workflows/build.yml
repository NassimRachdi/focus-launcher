name: Compiler l'APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clé de signature (identique à chaque version, sinon la mise à jour est refusée)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé en debug, les mises à jour automatiques ne fonctionneront pas."
          fi

      - name: Tests (décodage des lignes Bluetooth réelles)
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilation
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PupdateUrl=https://github.com/${{ github.repository }}/releases/latest/download/version.json
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/focus-launcher.apk
          cat > out/version.json <<EOF
          {"versionCode": ${{ github.run_number }}, "apk": "https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/focus-launcher.apk"}
          EOF

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Focus Launcher v${{ github.run_number }}
          make_latest: "true"
          files: |
            out/focus-launcher.apk
            out/version.json
