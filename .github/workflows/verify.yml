name: Vérifier la pull request

# Compile et lance les tests sur chaque pull request, sans rien publier ni signer.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests et compilation (debug)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
